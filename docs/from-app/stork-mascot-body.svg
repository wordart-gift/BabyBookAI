<svg xmlns="http://www.w3.org/2000/svg" width="200" height="230" viewBox="0 0 200 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Legs: thin, with three forward toes. -->
  <g stroke="#B5721C" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M90,172 L85,208"/>
    <path d="M85,208 L74,213"/>
    <path d="M85,208 L73,208"/>
    <path d="M85,208 L92,212"/>
    <path d="M110,172 L115,208"/>
    <path d="M115,208 L104,213"/>
    <path d="M115,208 L103,208"/>
    <path d="M115,208 L122,212"/>
  </g>

  <!-- Body. The wings are clipped to this outline so their outer edge IS the
       bird's edge — otherwise they read as coloured crescents floating behind. -->
  <clipPath id="storkBody">
    <path d="M100,84 C130,84 142,117 142,134 C142,163 126,176 100,176 C74,176 58,163 58,134 C58,117 70,84 100,84 Z"/>
  </clipPath>
  <path d="M100,84 C130,84 142,117 142,134 C142,163 126,176 100,176 C74,176 58,163 58,134 C58,117 70,84 100,84 Z" fill="#FFFCF6"/>
  <g clip-path="url(#storkBody)">
    <!-- The dark wing is painted by the Stork widget, so it can wave. -->
    <path d="M148,107 C156,148 138,173 116,166 C122,142 128,119 148,107 Z" fill="#4E97A5"/>
  </g>

  <!-- Neck and head. -->
  <path d="M100,96 C99,76 104,64 106,50" stroke="#FFFCF6" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="108" cy="42" r="21" fill="#FFFCF6"/>

  <!-- The bill and the eye are painted by the Stork widget, over this, so the
       bill can open and the eye can blink. Their geometry lives there. -->
</svg>
